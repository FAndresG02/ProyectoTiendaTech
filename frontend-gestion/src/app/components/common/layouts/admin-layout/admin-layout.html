<div class="public-layout-page">

    <header class="public-layout-header">
        <mat-toolbar class="public-layout-toolbar">

            <a class="navbar-brand" href="#">Navbar</a>

            <nav class="nav-links">
                <a class="nav-link active" routerLink="/">Inicio</a>
                <a class="nav-link active" routerLink="/offer">Ofertas</a>
                <a class="nav-link active" routerLink="/allProducts">Todos los productos</a>
            </nav>

            <form class="search-form" role="search">
                <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
                    <input matInput placeholder="Buscar productos" #searchInput />
                </mat-form-field>
                <button mat-stroked-button color="primary" class="search-button" type="submit">
                    Buscar
                </button>
            </form>

            <!-- Contenedor de las acciones de la barra de herramientas -->
            <div class="toolbar-actions">
                <!-- Verifica si el usuario está autenticado -->
                
                Botón de icono que abre el menú de usuario
                <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Cuenta">
                    <!-- Icono que representa la cuenta del usuario -->
                    <mat-icon>account_circle</mat-icon>
                </button>
                <!-- Menú desplegable asociado al botón de usuario -->
                <mat-menu #userMenu="matMenu">
                    <!-- Botón del menú que navega hacia el perfil -->
                    <button mat-menu-item routerLink="/profile">
                        <!-- Icono que representa el perfil del usuario -->
                        <mat-icon>person</mat-icon>
                        <!-- Texto que indica la opción "Mi perfil" -->
                        <span>Mi perfil</span>
                    </button>
                    <!-- Botón del menú que ejecuta el cierre de sesión -->
                    <button mat-menu-item>
                        <!-- Icono que representa el cierre de sesión -->
                        <mat-icon>logout</mat-icon>
                        <!-- Texto que indica la opción "Cerrar sesión" -->
                        <span>Cerrar sesión</span>
                    </button>
                    <!-- Cierre del menú de usuario -->
                </mat-menu>
                <!-- Caso contrario: el usuario no está autenticado -->
                
                <!-- Botón para iniciar sesión -->
                <button mat-stroked-button class="login-button" type="button" >
                    <!-- Texto que indica la acción de iniciar sesión -->
                    Iniciar Sesión
                </button>
                <!-- Botón para registrarse -->
                <button mat-flat-button class="register-button" type="button" >
                    <!-- Texto que indica la acción de registrarse -->
                    Registrarse
                </button>
                <!-- Cierre del bloque condicional @if/@else -->
                

                <!-- Botón de icono para acceder al carrito de compras -->
                <button mat-icon-button class="cart-button" type="button" aria-label="Carrito">
                    <!-- Icono que representa el carrito de compras -->
                    <mat-icon>shopping_cart</mat-icon>
                </button>
                <!-- Cierre del contenedor de acciones de la barra de herramientas -->
            </div>

        </mat-toolbar>
    </header>

    <main>
        <router-outlet></router-outlet>
    </main>

    <footer class="footer" id="signup">
        <div class="footer-bg-shapes">
            <span class="shape shape-1"></span>
            <span class="shape shape-2"></span>
            <span class="shape shape-3"></span>
        </div>

        <div class="footer-content">
            <div class="footer-logo">FG</div>
            <h2 class="footer-name">Franklin Guapisaca</h2>
            <p class="footer-copy">&copy; 2025 Franklin Guapisaca. Todos los derechos reservados.</p>
        </div>
    </footer>
</div>
